version: 2

# Keep compatible updates together; review major upgrades separately.
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pip-compatible:
        update-types: [minor, patch]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions-compatible:
        update-types: [minor, patch]
