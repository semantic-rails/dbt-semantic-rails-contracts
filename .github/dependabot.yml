version: 2

# Keep compatible updates together; review major upgrades separately.
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # compatibility.json owns these ranges; they move in reviewed pin PRs only.
    ignore:
      - dependency-name: "semantic-rails"
      - dependency-name: "dbt-core"
      - dependency-name: "dbt-duckdb"
    groups:
      pip-compatible:
        update-types: [minor, patch]
      pip-major:
        update-types: [major]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions-compatible:
        update-types: [minor, patch]
      github-actions-major:
        update-types: [major]
