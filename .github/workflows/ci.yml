name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:
    inputs:
      engine_sha:
        description: Exact lowercase 40-character Semantic Rails commit SHA to qualify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dbt-contracts-ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.engine_sha || 'released' }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Contract and release metadata
    runs-on: ubuntu-latest
    outputs:
      engine_release_state: ${{ steps.compatibility.outputs.engine_release_state }}
      engine_candidate_sha: ${{ steps.compatibility.outputs.engine_candidate_sha }}
      engine_minimum_spec: ${{ steps.compatibility.outputs.engine_minimum_spec }}
      engine_compatible_spec: ${{ steps.compatibility.outputs.engine_compatible_spec }}
    steps:
      - name: Check out dbt contracts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install metadata verification dependencies
        run: python -m pip install "PyYAML>=6.0"
      - name: Verify machine-readable compatibility metadata
        id: compatibility
        run: |
          python scripts/verify_release_metadata.py \
            --github-output "${GITHUB_OUTPUT}"
          python scripts/check_schema_compatibility.py

  engine-compatibility:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    needs: metadata
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compatibility: runtime-minimum
            python-version: "3.10"
            dbt-core: "dbt-core==1.11.2"
            engine-selection: "none"
            skip-export-tests: "true"
          - compatibility: full-minimum
            python-version: "3.11"
            dbt-core: "dbt-core==1.11.2"
            engine-selection: "minimum"
            skip-export-tests: "false"
          - compatibility: full-latest
            python-version: "3.12"
            dbt-core: "dbt-core>=1.11.2,<2.0"
            engine-selection: "latest"
            skip-export-tests: "false"
    name: ${{ needs.metadata.outputs.engine_release_state }} engine / dbt ${{ matrix.compatibility }} / Python ${{ matrix.python-version }}
    steps:
      - name: Check out dbt contracts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Check out the exact approved engine candidate
        if: matrix.engine-selection != 'none' && needs.metadata.outputs.engine_release_state == 'candidate'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: semantic-rails/semantic-rails
          ref: ${{ needs.metadata.outputs.engine_candidate_sha }}
          path: semantic-rails-engine
      - name: Verify the exact approved engine candidate
        if: matrix.engine-selection != 'none' && needs.metadata.outputs.engine_release_state == 'candidate'
        env:
          EXPECTED_SHA: ${{ needs.metadata.outputs.engine_candidate_sha }}
        run: |
          RESOLVED_SHA="$(git -C semantic-rails-engine rev-parse HEAD)"
          test "$(git -C semantic-rails-engine status --porcelain)" = ""
          if [[ "${RESOLVED_SHA}" != "${EXPECTED_SHA}" ]]; then
            echo "Resolved engine checkout ${RESOLVED_SHA} does not match ${EXPECTED_SHA}." >&2
            exit 1
          fi
      - name: Install compatibility environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "${{ matrix.dbt-core }}" \
            "dbt-duckdb>=1.10,<2.0" \
            "PyYAML>=6.0" \
            "jsonschema>=4.23"
      - name: Build and install the exact approved engine candidate
        if: matrix.engine-selection != 'none' && needs.metadata.outputs.engine_release_state == 'candidate'
        env:
          EXPECTED_VERSION: ${{ needs.metadata.outputs.engine_minimum_spec }}
        run: |
          python -m pip install "build>=1.2"
          python -m build --wheel --outdir engine-dist semantic-rails-engine
          ENGINE_WHEEL="$(find engine-dist -maxdepth 1 -name 'semantic_rails-*.whl' -print -quit)"
          test -n "${ENGINE_WHEEL}"
          python -m pip install "${ENGINE_WHEEL}"
          python -c \
            'from importlib.metadata import version; import os; assert "semantic-rails==" + version("semantic-rails") == os.environ["EXPECTED_VERSION"]'
          sha256sum "${ENGINE_WHEEL}" >> "${GITHUB_STEP_SUMMARY}"
      - name: Install the released engine artifact
        if: matrix.engine-selection != 'none' && needs.metadata.outputs.engine_release_state == 'released'
        env:
          ENGINE_SELECTION: ${{ matrix.engine-selection }}
          ENGINE_MINIMUM_SPEC: ${{ needs.metadata.outputs.engine_minimum_spec }}
          ENGINE_COMPATIBLE_SPEC: ${{ needs.metadata.outputs.engine_compatible_spec }}
        run: |
          case "${ENGINE_SELECTION}" in
            minimum) ENGINE_SPEC="${ENGINE_MINIMUM_SPEC}" ;;
            latest) ENGINE_SPEC="${ENGINE_COMPATIBLE_SPEC}" ;;
            *) echo "Unknown engine selection ${ENGINE_SELECTION}." >&2; exit 1 ;;
          esac
          python -m pip install "${ENGINE_SPEC}"
      - name: Run integration matrix
        env:
          SKIP_EXPORT_TESTS: ${{ matrix.skip-export-tests }}
        run: ./scripts/run_integration_tests.sh

  engine-candidate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: metadata
    continue-on-error: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compatibility: minimum
            python-version: "3.11"
            dbt-core: "dbt-core==1.11.2"
          - compatibility: latest
            python-version: "3.12"
            dbt-core: "dbt-core==1.12.0"
    name: ${{ github.event_name == 'schedule' && 'advisory engine main' || 'exact engine candidate' }} / dbt ${{ matrix.compatibility }}
    steps:
      - name: Check out dbt contracts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Require an immutable manual candidate identity
        if: github.event_name == 'workflow_dispatch'
        env:
          ENGINE_SHA: ${{ inputs.engine_sha }}
        run: |
          if [[ ! "${ENGINE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "engine_sha must be an exact lowercase 40-character commit SHA." >&2
            exit 1
          fi
      - name: Check out Semantic Rails candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: semantic-rails/semantic-rails
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.engine_sha || 'main' }}
          path: semantic-rails-engine
      - name: Verify and record the resolved engine revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.engine_sha || '' }}
        run: |
          RESOLVED_SHA="$(git -C semantic-rails-engine rev-parse HEAD)"
          if [[ -n "${EXPECTED_SHA}" && "${RESOLVED_SHA}" != "${EXPECTED_SHA}" ]]; then
            echo "Resolved engine checkout ${RESOLVED_SHA} does not match ${EXPECTED_SHA}." >&2
            exit 1
          fi
          {
            echo "### Engine candidate"
            echo '```text'
            echo "${RESOLVED_SHA}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Build and install the exact engine wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "build>=1.2" \
            "${{ matrix.dbt-core }}" \
            "dbt-duckdb>=1.10,<2.0" \
            "PyYAML>=6.0" \
            "jsonschema>=4.23"
          python -m build --wheel --outdir engine-dist semantic-rails-engine
          python -m pip install engine-dist/*.whl
          sha256sum engine-dist/*.whl >> "${GITHUB_STEP_SUMMARY}"
      - name: Run integration matrix against the exact wheel
        run: ./scripts/run_integration_tests.sh

  all-checks:
    name: All checks pass
    if: ${{ always() }}
    needs: [metadata, engine-compatibility, engine-candidate]
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable compatibility lane
        env:
          EVENT_NAME: ${{ github.event_name }}
          METADATA_RESULT: ${{ needs.metadata.result }}
          ENGINE_COMPATIBILITY_RESULT: ${{ needs['engine-compatibility'].result }}
          ENGINE_CANDIDATE_RESULT: ${{ needs['engine-candidate'].result }}
        run: |
          test "$METADATA_RESULT" = "success"
          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "push" ]]; then
            test "$ENGINE_COMPATIBILITY_RESULT" = "success"
            test "$ENGINE_CANDIDATE_RESULT" = "skipped"
          else
            test "$ENGINE_COMPATIBILITY_RESULT" = "skipped"
            test "$ENGINE_CANDIDATE_RESULT" = "success"
          fi
