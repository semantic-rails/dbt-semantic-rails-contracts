version: 1

defaults:
  profiles_dir: .
  run_deps: true
  run_parse: true

projects:
  - name: orders_warehouse
    project_dir: ../dbt-orders
    target: ci
    contract_file: semantic_rails_contract.yml

  - name: customers_warehouse
    project_dir: ../dbt-customers
    target: ci
    contract_file: semantic_rails_contract.yml

  - name: product_catalog_connector
    project_dir: ../dbt-products
    profile: product_catalog
    target: prod
    contract:
      contract_format_version: 1
      semantic:
        producer:
          name: semantic-rails
          version: 0.2.0
        packages:
          - package_id: product_catalog
            namespace: product_catalog
            package_schema_version: 1
            semantic_hash: sha256:replace-with-engine-produced-hash
            resources:
              - semantic_model_id: products
                relation: products
                columns:
                  - name: product_id
      binding:
        kind: dbt
        binding_version: 1
        packages:
          - package_id: product_catalog
            policy:
              severity: error
              require_model_contract: true
              require_model_version: true
              type_check: ignore
              allow_extra_columns: true
            resources:
              - semantic_model_id: products
                dbt_resource_type: model
                dbt_model: products
                dbt_package: dbt_products
                dbt_version: 1
                latest_version: 1
                access: public
                contract_enforced: true
